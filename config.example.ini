; Copy to config.ini for local settings. Never share the filled-in file.
[application]
host = 127.0.0.1
port = 5000
debug = false
; demo or live. Live mode executes SELECT queries when the dashboard is opened.
data_mode = demo
timezone_offset_minutes = 300

[database]
; Set true only with data_mode=live and cache enabled=true after SQL review.
enabled = false
; Optional complete ODBC connection string; overrides individual fields below.
; Example: DRIVER={ODBC Driver 17 for SQL Server};SERVER=SAPSERVERX;DATABASE=SPEL_ATTENDENCE;UID=sa;PWD={your-password};Encrypt=yes;TrustServerCertificate=no;ApplicationIntent=ReadOnly;
connection_string =
driver = ODBC Driver 17 for SQL Server
server = SAPSERVERX
database = SPEL_ATTENDENCE
; sql or windows
authentication = sql
username = sa
password =
encrypt = true
trust_server_certificate = false
connection_timeout_seconds = 5
query_timeout_seconds = 15

[cache]
; Required in live mode. Shared across users/threads in ONE server process.
; No database tables. Refresh on request after expiry; no background polling.
enabled = false
ttl_seconds = 60

[dashboard]
; Reload page and refresh shared machine data at this interval.
auto_refresh_seconds = 60

[employee_location_aliases]
; Optional equivalent labels: spelling in employee/device data = canonical location.
; Example only: head office = HeadOffice

[employee_directory]
; Refresh active biometric employees from zkk_Employees.
refresh_seconds = 60

[employee_overview]
; Shared roster/presence snapshot interval.
refresh_seconds = 60
long_stay_hours = 12
; Bound the inference window; older unclosed IN events are not classified.
lookback_hours = 72
; last_in_machine or employee_unit
location_basis = last_in_machine
; Direction comes from complete IN/OUT tokens in zkk_Devices.Name.

[machine_activity]
; Status follows punch datetime, not database receipt time.
recent_minutes = 10
delayed_minutes = 1440

[punch_history]
; Number of recent employee punches in each machine popup (1 to 100).
limit = 15

[ui_colors]
; RGB components: red, green, blue (0-255).
healthy = 76, 217, 150
attention = 255, 193, 92
critical = 255, 113, 128
information = 111, 177, 255
direction_in = 94, 191, 232
direction_out = 180, 153, 238

[wall_display]
; Grid sizing and fonts scale relative to these dimensions.
reference_tile_width = 340
reference_tile_height = 245
gap_pixels = 14
compact_gap_pixels = 8
compact_breakpoint_pixels = 800
max_font_scale = 1.7
