; Live deployment settings. Replace the SQL server and read-only login.
; Do not commit credentials or share this file after configuration.
[application]
host = 127.0.0.1
port = 5000
debug = false
data_mode = live
timezone_offset_minutes = 300

[deployment]
live_only = true

[server]
threads = 8

[database]
enabled = true
connection_string =
driver = ODBC Driver 17 for SQL Server
server = REPLACE_WITH_SQL_SERVER_NAME
database = SPEL_ATTENDENCE
authentication = sql
username =
password =
encrypt = true
trust_server_certificate = false
connection_timeout_seconds = 5
query_timeout_seconds = 15

[cache]
enabled = true
ttl_seconds = 60

[dashboard]
auto_refresh_seconds = 60

[employee_location_aliases]

[employee_directory]
refresh_seconds = 60

[hr_hours]
refresh_seconds = 300
default_days = 7
max_range_days = 31
max_rows = 50000
cached_ranges = 3
max_period_groups = 50000

[employee_overview]
refresh_seconds = 60
long_stay_hours = 12
lookback_hours = 96

[machine_activity]
recent_minutes = 10
delayed_minutes = 1440

[punch_history]
limit = 15

[ui_colors]
healthy = 76, 217, 150
attention = 255, 193, 92
critical = 255, 113, 128
information = 111, 177, 255
direction_in = 94, 191, 232
direction_out = 180, 153, 238

[wall_display]
reference_tile_width = 340
reference_tile_height = 245
gap_pixels = 14
compact_gap_pixels = 8
compact_breakpoint_pixels = 800
max_font_scale = 1.7

[security]
enabled = true
user_file = users.ini
account_directory = instance
password_storage = hash
minimum_password_length = 8
cookie_secure = false
