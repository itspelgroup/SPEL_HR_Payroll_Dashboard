; Reference only. Runtime users.ini is private and ignored by Git.
; Start the app, visit /setup on localhost, then manage users in /settings.
; Lists are JSON arrays. Never use example passwords in a running instance.
[meta]
format_version = 1
new_password_storage = plain

[location:Pandoki]
hr_units = []

; Example format (uncomment and fill all values only for a local account):
; [user:operator]
; password = REPLACE_WITH_PRIVATE_PASSWORD
; password_format = plain
; enabled = true
; is_admin = false
; all_locations = false
; tabs = ["machines", "alerts"]
; locations = ["Pandoki"]
; revision = CHANGE_WHEN_RESETTING_ACCESS
