{% extends 'account_base.html' %}{% block title %}My account{% endblock %}
{% block content %}<section class="panel narrow"><h1>My account</h1><p>{{ dashboard_user.username }} · Change password</p>
<form method="post" class="fields"><input type="hidden" name="csrf" value="{{ csrf_token }}">
<label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label>
<label>New password<input type="password" name="password" required minlength="{{ minimum }}" maxlength="512" autocomplete="new-password"></label>
<label>Confirm new password<input type="password" name="confirm_password" required minlength="{{ minimum }}" maxlength="512" autocomplete="new-password"></label>
<button class="primary">Change password</button></form></section>{% endblock %}
