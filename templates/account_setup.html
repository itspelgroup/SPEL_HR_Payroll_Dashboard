{% extends 'account_base.html' %}{% block title %}First administrator{% endblock %}
{% block content %}<section class="panel narrow"><h1>Create the first administrator</h1><p>Set up access on this server. No default password is provided.</p>
<form method="post" class="fields"><input type="hidden" name="csrf" value="{{ csrf_token }}">
<label>Username<input name="username" required pattern="[a-zA-Z0-9_.-]{1,64}" maxlength="64" autocomplete="username"></label>
<label>Password<input type="password" name="password" required minlength="{{ minimum }}" maxlength="512" autocomplete="new-password"></label>
<small>At least {{ minimum }} characters.</small><button class="primary">Create administrator</button></form></section>{% endblock %}
