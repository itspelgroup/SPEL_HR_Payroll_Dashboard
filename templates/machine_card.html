{% set m = row.machine %}{% set last = m.punches[0] if m.punches else none %}{% set fresh = row.status == 'Recent' %}
<button class="wall-tile {{ 'fresh' if fresh else 'delayed' }}" type="button" data-dialog="machine-{{ m.code }}" aria-controls="machine-{{ m.code }}" aria-haspopup="dialog"><span class="tile-heading"><span class="machine-name">{{ m.name }}</span><span class="indicator" title="{{ row.status }}"><i aria-hidden="true"></i><span>{% if fresh %}&lt;{{ recent }} min{% elif row.status == 'Disabled' %}Disabled{% else %}No recent punch{% endif %}</span></span></span><span class="last-punch"><span class="field-label">LAST PUNCH</span><span class="punch-datetime">{{ m.last_punch.strftime('%d %b %Y · %H:%M:%S') if m.last_punch else 'No punches recorded' }}</span><span class="employee-line"><span class="employee-id">{{ last.user_id if last else '—' }}</span><span class="employee-name">{{ (last.pname or 'Name unavailable') if last else 'No employee punch' }}</span></span><span class="employee-unit">{{ (last.employee_unit or 'Unit not assigned') if last else '—' }}</span></span></button>
