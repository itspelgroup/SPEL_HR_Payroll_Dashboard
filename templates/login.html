<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SPEL | Sign in</title><link rel="stylesheet" href="{{ url_for('static', filename='machines.css', v=1) }}"></head><body><header><a class="brand" href="/">SPEL <span>WORKFORCE SYSTEMS</span></a></header><main style="max-width:460px;margin:8vh auto"><p class="eyebrow">MACHINE MONITORING</p><h1>Sign in</h1><p class="muted">Use your assigned dashboard account.</p>{% if error %}<p class="banner" role="alert">{{ error }}</p>{% endif %}<form method="post" style="display:grid;gap:14px"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required><button type="submit">Sign in</button></form></main></body></html>
